name: Tests & Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by codecov/codecov-action's OIDC flow (no static upload token).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git diff / diff-cover can compare against origin/master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage diff-cover maturin
          pip install -e .  # Compiles Rust extensions into the environment

      - name: Run Pytest with Coverage
        run: |
          # The report location is defined in pyproject.toml
          pytest

      - name: Coverage of changed lines (diff-cover)
        # 1. Line-level coverage restricted to lines touched by this PR/branch.
        #    --fail-under=0 keeps this informational; raise it (e.g. 100) to
        #    enforce a diff-coverage gate. The overall 85% floor is enforced
        #    by [tool.coverage.report] fail_under during the test run.
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/master \
            --fail-under=0 \
            --format markdown:diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage of changed files
        # 2. File-level coverage of every .py file touched by this PR/branch
        #    (added, modified, or renamed; deleted files excluded).
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/master...HEAD \
            | { grep '\.py$' || true; } | paste -sd, -)
          if [ -n "$CHANGED_FILES" ]; then
            coverage report --include="$CHANGED_FILES" --fail-under=0
          else
            echo "No changed Python files."
          fi

      - name: Overall library coverage
        # 3. Coverage of the entire src/pysynthacs package (fail_under=85
        #    from pyproject.toml applies by default).
        run: coverage report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          # Authenticate via GitHub OIDC instead of a static CODECOV_TOKEN
          # secret. This satisfies Codecov's protected-branch token
          # requirement without needing a repository secret.
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
